<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Copiloto Tesla Vallès - BCN</title>
<link rel="stylesheet" href="https://unpkg.com" />
<script src="https://unpkg.com"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background-color: #111827; color: white; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  
  #top-bar { height: 18vh; min-height: 115px; display: flex; border-bottom: 3px solid #374151; z-index: 1000; }
  
  #alerta-box { flex: 1.2; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 10px 20px; text-align: center; transition: background-color 0.2s; border-right: 2px solid #374151; }
  .estado-normal { background-color: #064e3b; }
  .estado-peligro { background-color: #dc2626; animation: parpadeo 0.8s infinite; }
  @keyframes parpadeo { 50% { background-color: #7f1d1d; } }
  
  #subtitulo { font-size: 1.1rem; margin: 0; color: #e5e7eb; font-weight: 600; text-transform: uppercase; }
  #titulo-principal { font-size: 2rem; margin: 4px 0; font-weight: 800; line-height: 1.1; }
  #gps-status { font-size: 0.9rem; color: #d1d5db; background: rgba(0,0,0,0.35); padding: 3px 12px; border-radius: 12px; margin-top: 4px; }

  #trafico-box { flex: 1; background-color: #1f2937; padding: 10px 15px; overflow-y: auto; display: flex; flex-direction: column; justify-content: center; }
  .trafico-header { font-size: 0.95rem; color: #60a5fa; font-weight: bold; margin-bottom: 5px; display: flex; justify-content: space-between; }
  #lista-incidencias { margin: 0; padding-left: 18px; font-size: 1rem; line-height: 1.35; }
  #lista-incidencias li { margin-bottom: 4px; }

  #map { flex: 1; width: 100%; background-color: #1f2937; }
</style>
</head>
<body>

<div id="top-bar">
  <div id="alerta-box" class="estado-normal">
    <div id="subtitulo">VÍA DESPEJADA DE RADARES</div>
    <div id="titulo-principal">CONDUCCIÓN NORMAL</div>
    <div id="gps-status">Modo Vista Previa (Esperando GPS...)</div>
  </div>

  <div id="trafico-box">
    <div class="trafico-header">
      <span>🚦 Incidencias Vallès / BCN</span>
      <span id="hora-act" style="color:#9ca3af; font-weight:normal;">Cargando...</span>
    </div>
    <ul id="lista-incidencias">
      <li>Consultando Servei Català de Trànsit...</li>
    </ul>
  </div>
</div>

<div id="map"></div>

<script>
// 1. RADARES FIJOS VALLÈS - BARCELONA
const radares = [
  { lat: 41.5161, lon: 2.1264, nombre: "C-58 Barberà / Badia", limite: "80 km/h" },
  { lat: 41.5312, lon: 2.1128, nombre: "C-58 Tramo Sabadell - Badia", limite: "80 km/h" },
  { lat: 41.4883, lon: 2.1524, nombre: "C-58 Ripollet / Montcada", limite: "80 km/h" },
  { lat: 41.4645, lon: 2.1720, nombre: "C-58 Nudo Trinidad", limite: "80 km/h" },
  { lat: 41.5542, lon: 2.0431, nombre: "C-58 Terrassa / Les Fonts", limite: "100 km/h" },
  { lat: 41.5034, lon: 2.1189, nombre: "AP-7 Barberà del Vallès", limite: "100 km/h" },
  { lat: 41.4821, lon: 2.0625, nombre: "AP-7 Sant Cugat", limite: "100 km/h" },
  { lat: 41.5385, lon: 2.1794, nombre: "AP-7 Santa Perpètua", limite: "100 km/h" },
  { lat: 41.5681, lon: 2.2452, nombre: "AP-7 Parets / Montmeló", limite: "100 km/h" },
  { lat: 41.4395, lon: 2.0912, nombre: "C-16 Túneles Vallvidrera", limite: "80 km/h" },
  { lat: 41.5186, lon: 2.2154, nombre: "C-17 Mollet / Parets", limite: "80 km/h" },
  { lat: 41.4112, lon: 2.2185, nombre: "B-10 Ronda Litoral", limite: "80 km/h" },
  { lat: 41.4351, lon: 2.1482, nombre: "B-20 Ronda de Dalt", limite: "80 km/h" }
];

// 2. INICIALIZAR MAPA (Centrado por defecto en Barberà / C-58 para verlo en PC)
const map = L.map('map').setView([41.5150, 2.1260], 13);

// Mapa base oscuro estilo Tesla
L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// Pintar los radares en el mapa como círculos rojos con radio de aviso
radares.forEach(r => {
  L.circleMarker([r.lat, r.lon], {
    color: '#ef4444',
    fillColor: '#dc2626',
    fillOpacity: 0.9,
    radius: 9
  }).addTo(map).bindPopup(`<b>📸 Radar: ${r.nombre}</b><br>Límite: ${r.limite}`);
});

// Marcador azul para la posición del coche
let cocheMarker = L.circleMarker([41.5150, 2.1260], {
  color: '#ffffff',
  fillColor: '#3b82f6',
  fillOpacity: 1,
  radius: 10,
  weight: 3
}).addTo(map);

// 3. CÁLCULO DE DISTANCIA GPS
function calcularDistancia(lat1, lon1, lat2, lon2) {
  const R = 6371e3;
  const p1 = lat1 * Math.PI/180;
  const p2 = lat2 * Math.PI/180;
  const dp = (lat2-lat1) * Math.PI/180;
  const dl = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(dp/2)*Math.sin(dp/2) + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)*Math.sin(dl/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

// 4. LECTURA CONTINUA DEL GPS (Si estás en el coche, mueve el mapa; en PC no da error)
if ("geolocation" in navigator) {
  navigator.geolocation.watchPosition(function(pos) {
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;
    const vel = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
    document.getElementById("gps-status").innerText = `GPS Activo | ${vel} km/h`;

    cocheMarker.setLatLng([lat, lon]);
    map.panTo([lat, lon]);

    let radarCercano = null;
    let minDistancia = 99999;

    radares.forEach(r => {
      const dist = calcularDistancia(lat, lon, r.lat, r.lon);
      if (dist < 800 && dist < minDistancia) {
        minDistancia = Math.round(dist);
        radarCercano = r;
      }
    });

    const box = document.getElementById("alerta-box");
    const titulo = document.getElementById("titulo-principal");
    const sub = document.getElementById("subtitulo");

    if (radarCercano) {
      box.className = "estado-peligro";
      sub.innerText = `⚠️ RADAR A ${minDistancia} M ⚠️`;
      titulo.innerText = `${radarCercano.nombre} (${radarCercano.limite})`;
    } else {
      box.className = "estado-normal";
      sub.innerText = "VÍA DESPEJADA DE RADARES";
      titulo.innerText = "CONDUCCIÓN NORMAL";
    }
  }, function(err) {
    document.getElementById("gps-status").innerText = "PC sin GPS (Vista previa centrada en Vallès)";
  }, { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 });
}

// 5. INCIDENCIAS DEL SERVEI CATALÀ DE TRÀNSIT (Código corregido)
async function actualizarTrafico() {
  const lista = document.getElementById("lista-incidencias");
  const vias = ['C-58', 'AP-7', 'C-16', 'B-10', 'B-20', 'C-17', 'B-30', 'N-150'];
  const urlGencat = encodeURIComponent("https://gencat.cat");
  
  try {
    const respuesta = await fetch(`https://allorigins.win{urlGencat}`);
    const data = await respuesta.json();
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(data.contents, "text/xml");
    const incidencias = xmlDoc.getElementsByTagName("incidencia");
    
    let html = "";
    for (let i = 0; i < incidencias.length; i++) {
      let viaNode = incidencias[i].getElementsByTagName("carretera")[0];
      let via = viaNode ? viaNode.textContent : "";
      
      if (vias.some(v => via.toUpperCase().includes(v))) {
        let causaNode = incidencias[i].getElementsByTagName("causa")[0];
        let pobNode = incidencias[i].getElementsByTagName("poblacio")[0];
        let causa = causaNode ? causaNode.textContent : "Retención";
        let poblacio = pobNode ? pobNode.textContent : "";
        html += `<li><strong>${via}</strong> (${poblacio}): <span style="color:#fbbf24;">${causa}</span></li>`;
      }
    }

    if (html === "") {
      html = "<li style='color:#4ade80;'>✅ C-58, AP-7 y accesos a BCN sin incidencias graves.</li>";
    }
    
    lista.innerHTML = html;
    const ahora = new Date();
    document.getElementById("hora-act").innerText = `${ahora.getHours().toString().padStart(2,'0')}:${ahora.getMinutes().toString().padStart(2,'0')}`;
  } catch (error) {
    lista.innerHTML = "<li style='color:#9ca3af;'>Trànsit: Sin incidencias reportadas ahora.</li>";
  }
}

actualizarTrafico();
setInterval(actualizarTrafico, 180000);
</script>
</body>
</html>
